case 'tombLight':body=`<circle cx="330" cy="213" r="305" fill="url(#halo)"/><g stroke="#eed49c" stroke-width="4" opacity=".34"><path d="M302 15L291 140M493 50L433 160M573 237L465 260M128 60L208 177M50 235L158 262"/></g><path d="M85 510V335q9-143 226-162 223 18 238 162v175" fill="#8e918d" opacity=".55"/><path d="M152 512V352q5-119 160-119t154 119v160" fill="#061522" stroke="#e3c99f" stroke-width="9"/><path d="M197 510q15-144 114-172q91 31 113 173" fill="#ffe2a0" opacity=".24"/><circle cx="496" cy="441" r="105" fill="#7e8889" stroke="#c4bba5" stroke-width="13"/><path d="M446 394Q501 373 544 421" fill="none" stroke="#fff1d2" stroke-width="6" opacity=".26"/>${ground}<path d="M191 510L311 352 419 509" fill="url(#pathGlow)" opacity=".4"/>`;break;
case 'harvest':body=`<circle cx="326" cy="229" r="260" fill="url(#halo)" opacity=".6"/>${ground}<g fill="none" stroke="#9dbb95" stroke-width="6" stroke-linecap="round"><path d="M319 528V224M242 529V322M396 529V340M168 527V423M465 527V414"/></g><g fill="#e6c27e" opacity=".82"><ellipse cx="285" cy="240" rx="15" ry="29" transform="rotate(-34 285 240)"/><ellipse cx="353" cy="232" rx="15" ry="29" transform="rotate(35 353 232)"/><ellipse cx="295" cy="284" rx="14" ry="28" transform="rotate(-38 295 284)"/><ellipse cx="347" cy="283" rx="14" ry="28" transform="rotate(38 347 283)"/><ellipse cx="216" cy="352" rx="13" ry="24" transform="rotate(-35 216 352)"/><ellipse cx="272" cy="362" rx="13" ry="24" transform="rotate(35 272 362)"/><ellipse cx="374" cy="365" rx="13" ry="25" transform="rotate(-35 374 365)"/><ellipse cx="419" cy="357" rx="13" ry="25" transform="rotate(30 419 357)"/><ellipse cx="147" cy="450" rx="12" ry="22" transform="rotate(-27 147 450)"/><ellipse cx="192" cy="455" rx="12" ry="22" transform="rotate(28 192 455)"/><ellipse cx="442" cy="450" rx="12" ry="23" transform="rotate(-25 442 450)"/><ellipse cx="489" cy="444" rx="12" ry="23" transform="rotate(30 489 444)"/></g><path d="M318 216v-69" stroke="#fee3a7" stroke-width="4" opacity=".8"/>`;break;

case 'bridge':body=`<circle cx="305" cy="244" r="286" fill="url(#halo)" opacity=".58"/><g fill="none" stroke="#e1cfb3" opacity=".22"><circle cx="306" cy="253" r="219" stroke-width="3"/><circle cx="306" cy="253" r="166" stroke-width="2"/></g><path d="M50 506Q168 485 240 420T324 280Q348 229 367 204Q390 168 469 126" fill="none" stroke="#e6c692" stroke-width="37" opacity=".67" stroke-linecap="round"/><path d="M50 506Q168 485 240 420T324 280Q348 229 367 204Q390 168 469 126" fill="none" stroke="#fff1cb" stroke-width="6" opacity=".8" stroke-linecap="round"/><g fill="#ead7b4" opacity=".5"><circle cx="469" cy="126" r="37"/><circle cx="50" cy="506" r="24"/></g><path d="M39 544H589" stroke="#a3bdc8" opacity=".25" stroke-width="2"/>`;break;

return `<svg class="illustration" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 630 600" role="img" aria-label="Symbolic religious illustration">${defs}${body}</svg>`;
}
function readingMarkup(s){if(!s.scripture&&!s.salvation)return'';return `<div class="reading-bar"><div class="read-box"><span class="read-glyph" aria-hidden="true">✝</span><span class="minilabel">${escapeHTML(s.readingLabel||(s.scripture?.startsWith('CCC')?'CATECHISM':'READ ALOUD · NRSV-CE'))}</span><div class="read-copy">${escapeHTML(s.scripture||'')}<small>${escapeHTML(s.listen||'Refer to the notes.')}</small></div></div><div class="salvation-box"><span class="minilabel">SALVATION</span><div class="saviour-text">${escapeHTML(s.salvation||'Read, reflect and connect the event to Christian salvation.')}</div></div></div>`}
function insightMarkup(s){if(!s.insight)return'';return `<button class="insight-toggle" id="insightBtn" aria-pressed="${insight}" aria-expanded="${insight}"><span class="dot"></span>DEEPER CONNECTION ${insight?'−':'+'}</button>${insight?`<div class="insight-panel" id="insightPanel"><button id="insightClose" aria-label="Close insight">×</button><h4>GO A LEVEL DEEPER</h4><p>${escapeHTML(s.insight)}</p></div>`:''}`}
function cardHeading(s){return `<div class="kicker">${escapeHTML(s.eyebrow)}</div><h1 class="headline">${s.title}</h1>${s.dek?`<p class="dek">${escapeHTML(s.dek)}</p>`:''}`}
function renderBody(s){switch(s.kind){
case 'bridge':return `${cardHeading(s)}<div class="bridge-grid">${s.steps.map(c=>`<div class="bridge-step"><span>${c[0]}</span><h3>${escapeHTML(c[1])}</h3><p>${escapeHTML(c[2])}</p></div>`).join('')}</div>${readingMarkup(s)}`;
case 'exit':return `${cardHeading(s)}<ol class="exit-questions">${s.questions.map(q=>`<li>${escapeHTML(q)}</li>`).join('')}</ol>${readingMarkup(s)}`;
case 'title':return `<div class="copy-column"><div class="title-eyebrow">${escapeHTML(s.eyebrow)}</div><h1 class="headline">${s.title}</h1><p class="dek">${escapeHTML(s.dek)}</p><div class="small-callout">${escapeHTML(s.callout)}</div></div><div class="hero-art">${artSVG(s.art)}</div><span class="art-caption">${escapeHTML(s.artCaption)}</span>${readingMarkup(s)}`;
case 'question':return `<div class="question-mark" aria-hidden="true">?</div>${cardHeading(s)}${readingMarkup(s)}`;
case 'overview':return `${cardHeading(s)}<div class="overview-grid">${s.cards.map(c=>`<div class="overview-card"><span class="num">${c[0]}</span><span class="icon" aria-hidden="true">${c[3]}</span><h3 class="word">${c[1]}</h3><div class="desc">${c[2]}</div></div>`).join('')}</div><div class="overview-line">${escapeHTML(s.quote)}</div>${readingMarkup(s)}`;
case 'compare':return `${cardHeading(s)}<div class="compare-grid">${[s.left,s.right].map(o=>`<div class="compare-col"><small>${escapeHTML(o.over)}</small><h3>${escapeHTML(o.heading)}</h3>${o.points.map(p=>`<div class="comparison-point">${escapeHTML(p)}</div>`).join('')}</div>`).join('')}<div class="compare-arrow" aria-hidden="true">→</div></div>${readingMarkup(s)}`;
case 'split':return `<div class="split-layout"><div class="copy-column">${cardHeading(s)}<ul class="points">${s.points.map(p=>`<li><span class="bullet-mark">✧</span><span class="txt">${p}</span></li>`).join('')}</ul></div><figure class="art-container">${artSVG(s.art)}<figcaption class="art-caption">${escapeHTML(s.artCaption)}</figcaption></figure></div>${readingMarkup(s)}`;
case 'three':return `${cardHeading(s)}<div class="three-grid">${s.cards.map(c=>`<div class="three-card"><span class="sym">${c[0]}</span><h3>${escapeHTML(c[1])}</h3><p>${escapeHTML(c[2])}</p></div>`).join('')}</div>${readingMarkup(s)}`;
case 'diagram':return `${cardHeading(s)}<div class="flowline">${s.nodes.map((c,i)=>`${i?'<div class="flow-arrow" aria-hidden="true">→</div>':''}<div class="flow-node"><span class="num">${c[0]}</span><h3>${escapeHTML(c[1])}</h3><p>${escapeHTML(c[2])}</p></div>`).join('')}</div><div class="flow-below">${escapeHTML(s.after)}</div>${readingMarkup(s)}`;
case 'reveal':return `${cardHeading(s)}<div class="reveal-well">${reveal?`<div class="hidden-text">${escapeHTML(s.hidden)}</div>`:`<div class="before-reveal">${escapeHTML(s.before)}</div>`}</div><button class="reveal-button" id="revealBtn" aria-pressed="${reveal}">${reveal?'↶  HIDE THE ANSWER':'✦  REVEAL A RESPONSE'}</button>${readingMarkup(s)}`;
case 'sacraments':return `${cardHeading(s)}<div class="sacrament-grid">${[s.left,s.right].map(c=>`<div class="sacrament-card"><span class="glyph" aria-hidden="true">${c.glyph}</span><div class="over">${escapeHTML(c.over)}</div><h3>${escapeHTML(c.heading)}</h3><p>${escapeHTML(c.text)}</p><small>READ: ${escapeHTML(c.verse)}</small></div>`).join('')}</div>${readingMarkup(s)}`;
case 'recap':return `${cardHeading(s)}<div class="recap-rows">${s.rows.map(c=>`<div class="recap-row"><div class="recap-label">${escapeHTML(c[0])}</div><div class="recap-event">${escapeHTML(c[1])}</div><div class="recap-gift">${escapeHTML(c[2])}</div></div>`).join('')}</div><div class="recap-result">${escapeHTML(s.after)}</div>${readingMarkup(s)}`;
case 'final':return `${cardHeading(s)}<div class="opening-quote">The last word is not death. It is life in Christ.</div>${readingMarkup(s)}`;
default:return cardHeading(s)}
}
function render(){const s=slides[current];document.title=`${progressStr(current+1)} · ${s.title.replace(/<[^>]*>/g,'')} | Catholic Moral Truth`;byId('stage').innerHTML=`<section class="scene scene--${s.kind} theme-${s.stage}${s.tone?' tone-'+s.tone:''}" aria-label="Slide ${current+1} of ${slides.length}">${renderBody(s)}${insightMarkup(s)}</section>`;
byId('progressNum').textContent=`${progressStr(current+1)} / ${progressStr(slides.length)}`;byId('progressFill').style.width=`${(current+1)/slides.length*100}%`;byId('prevBtn').disabled=current===0;byId('nextBtn').disabled=current===slides.length-1;byId('nextBtn').querySelector('span').textContent=current===slides.length-1?'END OF LECTURE':'NEXT SLIDE';
byId('chapterNav').innerHTML=stages.map(([id,label])=>`<button class="stage-btn ${s.stage===id?'active':''}" data-stage="${id}" aria-current="${s.stage===id?'step':'false'}">${label}</button>`).join('');document.querySelectorAll('[data-stage]').forEach(btn=>btn.addEventListener('click',()=>go(slides.findIndex(x=>x.stage===btn.dataset.stage))));
const iBtn=byId('insightBtn');if(iBtn)iBtn.onclick=()=>{insight=!insight;render()};const iClose=byId('insightClose');if(iClose)iClose.onclick=()=>{insight=false;render()};const rBtn=byId('revealBtn');if(rBtn)rBtn.onclick=()=>{reveal=!reveal;render()};
}
function go(index){if(index<0||index>=slides.length)return;if(index===current){closeOverlay();return}current=index;reveal=false;insight=false;closeOverlay();render();}
function showOverlay(mode){overlayMode=mode;const wrap=byId('overlay');if(mode==='overview'){wrap.innerHTML=`<div class="overlay-header"><div><h2 class="overlay-title" id="overlayTitle">All slides</h2><div class="overlay-desc">Select any part of the lecture to jump there.</div></div><button class="overlay-close" id="closeBtn">✕ Close (Esc)</button></div><div class="overview-list">${slides.map((s,i)=>`<button class="overview-choice ${i===current?'selected':''}" data-index="${i}"><span class="slide-number">${progressStr(i+1)}</span><span class="overview-stage">${stages.find(x=>x[0]===s.stage)?.[1]}</span><span class="overview-title">${s.title.replace(/<[^>]*>/g,'')}</span></button>`).join('')}</div>`}else if(mode==='notes'){
const s=slides[current];wrap.innerHTML=`<div class="overlay-header"><div><h2 class="overlay-title" id="overlayTitle">Presenter notes</h2><div class="overlay-desc">Slide ${current+1} of ${slides.length} · ${stages.find(x=>x[0]===s.stage)?.[1]}</div></div><button class="overlay-close" id="closeBtn">✕ Close (Esc)</button></div><div class="notes-shell"><h3>${s.title.replace(/<[^>]*>/g,'')}</h3><div class="ref-note">${['SOCIAL CONNECTION','HISTORICAL CONNECTION'].includes(s.readingLabel)?'Reference':s.scripture?.startsWith('CCC')?'Catechism':'Scripture (NRSV-CE)'}: ${escapeHTML(s.scripture||'—')}</div><ol>${(s.notes||[]).map(n=>`<li>${escapeHTML(n)}</li>`).join('')}</ol><div class="teacher-prompt"><strong>ASK STUDENTS:</strong> ${escapeHTML(s.prompt||'What stands out?')}</div><div class="notes-sources">${escapeHTML(s.sourceNote)}${s.sources.length?'<br>'+s.sources.map(([label,url])=>`<a href="${escapeHTML(url)}" target="_blank" rel="noopener">${escapeHTML(label)}</a>`).join(' · '):''}</div></div>`;
}else{wrap.innerHTML=`<div class="overlay-header"><div><h2 class="overlay-title" id="overlayTitle">Presentation controls</h2><div class="overlay-desc">Works entirely offline in your browser. No sign-in required.</div></div><button class="overlay-close" id="closeBtn">✕ Close (Esc)</button></div><div class="help-grid"><div class="help-item"><span>Next slide</span><span class="key">→ / Space / Page Down</span></div><div class="help-item"><span>Previous slide</span><span class="key">← / Page Up</span></div><div class="help-item"><span>Go to first / last slide</span><span class="key">Home / End</span></div><div class="help-item"><span>Slide overview</span><span class="key">O</span></div><div class="help-item"><span>Presenter notes</span><span class="key">N</span></div><div class="help-item"><span>Fullscreen</span><span class="key">F</span></div><div class="help-item"><span>Deeper connection</span><span class="key">D</span></div><div class="help-item"><span>Close panel</span><span class="key">Esc</span></div></div>`}
wrap.classList.add('open');wrap.querySelector('#closeBtn').onclick=closeOverlay;wrap.querySelectorAll('[data-index]').forEach(b=>b.onclick=()=>go(Number(b.dataset.index)));wrap.scrollTop=0;byId('app').inert=true;wrap.querySelector('#closeBtn').focus();
}
function closeOverlay(){const restore=overlayMode;overlayMode=null;byId('app').inert=false;byId('overlay').classList.remove('open');byId('overlay').innerHTML='';if(restore)byId(restore==='notes'?'notesBtn':restore==='overview'?'overviewBtn':'helpBtn').focus()}
function toggleOverlay(mode){if(overlayMode===mode)closeOverlay();else showOverlay(mode)}
function toggleFull(){if(document.fullscreenElement){document.exitFullscreen?.()}else{document.documentElement.requestFullscreen?.().catch(()=>{})}}
byId('prevBtn').onclick=()=>go(current-1);byId('nextBtn').onclick=()=>go(current+1);
byId('notesBtn').onclick=()=>toggleOverlay('notes');byId('overviewBtn').onclick=()=>toggleOverlay('overview');byId('fullBtn').onclick=toggleFull;byId('helpBtn').onclick=()=>toggleOverlay('help');
byId('overlay').addEventListener('click',e=>{if(e.target===byId('overlay'))closeOverlay()});
document.addEventListener('keydown',e=>{if(e.altKey||e.ctrlKey||e.metaKey)return;const key=e.key;if(e.target.closest('input,textarea,select')||((key===' '||key==='Enter')&&e.target.closest('button,a')))return;if(['ArrowRight','ArrowLeft','PageDown','PageUp',' ','Home','End','Escape'].includes(key))e.preventDefault();if(key==='Escape'){if(overlayMode)closeOverlay();else if(insight){insight=false;render()}return}if(overlayMode){if(key.toLowerCase()==='n'&&overlayMode==='notes'||key.toLowerCase()==='o'&&overlayMode==='overview')closeOverlay();return}if(key==='ArrowRight'||key==='PageDown'||key===' '){go(current+1)}else if(key==='ArrowLeft'||key==='PageUp'){go(current-1)}else if(key==='Home'){go(0)}else if(key==='End'){go(slides.length-1)}else if(key.toLowerCase()==='o'){showOverlay('overview')}else if(key.toLowerCase()==='n'){showOverlay('notes')}else if(key.toLowerCase()==='f'){toggleFull()}else if(key.toLowerCase()==='d'&&slides[current].insight){insight=!insight;render()}else if(key==='?'){showOverlay('help')}});
let touchX=0,touchY=0;byId('stage').addEventListener('touchstart',e=>{touchX=e.changedTouches[0].screenX;touchY=e.changedTouches[0].screenY},{passive:true});byId('stage').addEventListener('touchend',e=>{const dx=e.changedTouches[0].screenX-touchX,dy=e.changedTouches[0].screenY-touchY;if(Math.abs(dx)>70&&Math.abs(dx)>Math.abs(dy)*1.5){go(current+(dx<0?1:-1))}},{passive:true});
document.addEventListener('keydown',e=>{if(e.key!=='Tab'||!overlayMode)return;const focusable=[...byId('overlay').querySelectorAll('button,a[href]')];const first=focusable[0],last=focusable[focusable.length-1];if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()}});
render();
</script>
</body>
</html>
